<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dot — AI Companion (Lite)</title>
  <script src="/js/neutralino.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: flex-start;
      padding: 12px;
    }

    .container {
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    /* Mascot Avatar */
    .avatar-wrapper {
      position: relative;
      width: 90px;
      height: 90px;
      cursor: grab;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .avatar-wrapper:active {
      cursor: grabbing;
      transform: scale(0.95);
    }

    .avatar-aura {
      position: absolute;
      width: 115px;
      height: 115px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(168, 85, 247, 0.5) 0%, rgba(168, 85, 247, 0.1) 60%, transparent 80%);
      pointer-events: none;
      animation: pulseAura 3s ease-in-out infinite;
    }

    @keyframes pulseAura {
      0%, 100% { transform: scale(1); opacity: 0.7; }
      50% { transform: scale(1.1); opacity: 0.9; }
    }

    .avatar-body {
      position: relative;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #9333ea, #7e22ce 60%, #581c87 100%);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35), inset 0 2px 6px rgba(255, 255, 255, 0.4);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
    }

    .avatar-body.bean {
      height: 94px;
      border-radius: 40px;
    }

    .avatar-body.drop {
      border-radius: 40px 40px 50px 50px;
    }

    .eyes {
      display: flex;
      gap: 18px;
      margin-top: 2px;
    }

    .eye {
      width: 16px;
      height: 16px;
      background: #ffffff;
      border-radius: 50%;
      position: relative;
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.2);
    }

    .pupil {
      width: 8px;
      height: 8px;
      background: #1e1b4b;
      border-radius: 50%;
      position: absolute;
      top: 4px;
      left: 4px;
      transition: transform 0.05s linear;
    }

    .pupil::after {
      content: '';
      position: absolute;
      top: 1px;
      left: 1px;
      width: 2.5px;
      height: 2.5px;
      background: white;
      border-radius: 50%;
    }

    .blush-container {
      display: flex;
      gap: 36px;
      margin-top: 4px;
    }

    .blush {
      width: 12px;
      height: 6px;
      border-radius: 50%;
      background: rgba(244, 114, 182, 0.4);
    }

    /* Floating Chat Bubble */
    .chat-panel {
      width: 320px;
      height: 420px;
      background: rgba(24, 24, 32, 0.94);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.4);
      color: #fff;
      overflow: hidden;
    }

    .chat-header {
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.03);
    }

    .chat-header-title {
      font-weight: 700;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .badge {
      font-size: 9px;
      background: rgba(168, 85, 247, 0.25);
      border: 1px solid rgba(168, 85, 247, 0.4);
      color: #d8b4fe;
      padding: 2px 6px;
      border-radius: 10px;
    }

    .lang-select {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      font-size: 10px;
      border-radius: 8px;
      padding: 2px 4px;
      outline: none;
      cursor: pointer;
    }

    .presets-bar {
      display: flex;
      gap: 4px;
      padding: 6px 10px;
      background: rgba(0, 0, 0, 0.25);
      overflow-x: auto;
    }

    .preset-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid transparent;
      color: rgba(255, 255, 255, 0.8);
      font-size: 10px;
      padding: 3px 8px;
      border-radius: 12px;
      cursor: pointer;
      white-space: nowrap;
    }

    .preset-btn.active {
      background: rgba(168, 85, 247, 0.4);
      border-color: #a855f7;
      color: #fff;
    }

    .messages {
      flex: 1;
      padding: 12px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      font-size: 12px;
      line-height: 1.4;
      user-select: text;
      -webkit-user-select: text;
    }

    .msg {
      max-width: 85%;
      padding: 8px 12px;
      border-radius: 12px;
      word-break: break-word;
      user-select: text;
      -webkit-user-select: text;
    }

    .msg.user {
      align-self: flex-end;
      background: #7e22ce;
      color: #fff;
      border-bottom-right-radius: 2px;
    }

    .msg.model {
      align-self: flex-start;
      background: rgba(255, 255, 255, 0.1);
      color: #e2e8f0;
      border-bottom-left-radius: 2px;
    }

    .msg-body {
      white-space: pre-wrap;
      word-break: break-word;
      user-select: text;
      -webkit-user-select: text;
    }

    .msg-footer {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 6px;
      margin-top: 6px;
      padding-top: 4px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    .copy-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: rgba(255, 255, 255, 0.7);
      font-size: 9.5px;
      padding: 2px 6px;
      border-radius: 5px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      transition: all 0.15s ease;
    }

    .copy-btn:hover {
      background: rgba(168, 85, 247, 0.35);
      color: #fff;
      border-color: #a855f7;
    }

    .copy-btn.copied {
      background: rgba(34, 197, 94, 0.35);
      color: #86efac;
      border-color: #22c55e;
    }

    .input-bar {
      padding: 8px 10px;
      display: flex;
      gap: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(0, 0, 0, 0.2);
    }

    .input-bar input {
      flex: 1;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      padding: 6px 10px;
      color: #fff;
      font-size: 11.5px;
      outline: none;
    }

    .input-bar button {
      background: #9333ea;
      border: none;
      color: white;
      padding: 0 12px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 13px;
    }

    .tools-bar {
      display: flex;
      gap: 6px;
      padding: 4px 10px;
      background: rgba(255, 255, 255, 0.04);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .tool-btn {
      background: rgba(255, 255, 255, 0.08);
      border: none;
      color: rgba(255, 255, 255, 0.8);
      font-size: 9.5px;
      padding: 3px 6px;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Avatar Mascot -->
    <div class="avatar-wrapper" id="avatarWrapper">
      <div class="avatar-aura" id="avatarAura"></div>
      <div class="avatar-body" id="avatarBody">
        <div class="eyes">
          <div class="eye"><div class="pupil" id="pupilL"></div></div>
          <div class="eye"><div class="pupil" id="pupilR"></div></div>
        </div>
        <div class="blush-container">
          <div class="blush"></div>
          <div class="blush"></div>
        </div>
      </div>
    </div>

    <!-- Chat Window -->
    <div class="chat-panel" id="chatPanel">
      <div class="chat-header">
        <div class="chat-header-title">
          <span id="activeName">Dot</span>
          <span class="badge">Gemini 3.8</span>
        </div>
        <div style="display: flex; align-items: center; gap: 8px;">
          <select class="lang-select" id="langSelect" onchange="changeLanguage(this.value)">
            <option value="ru">🇷🇺 Русский</option>
            <option value="en">🇺🇸 English</option>
            <option value="zh">🇨🇳 中文</option>
            <option value="ja">🇯🇵 日本語</option>
            <option value="es">🇪🇸 Español</option>
            <option value="de">🇩🇪 Deutsch</option>
            <option value="fr">🇫🇷 Français</option>
            <option value="ko">🇰🇷 한국어</option>
          </select>
          <div style="cursor: pointer; font-size: 14px; opacity: 0.6;" onclick="toggleChat()">✕</div>
        </div>
      </div>

      <!-- Presets Selector -->
      <div class="presets-bar">
        <button class="preset-btn active" onclick="setPreset('dot')">🟣 Dot</button>
        <button class="preset-btn" onclick="setPreset('alfred')">🟡 Alfred</button>
        <button class="preset-btn" onclick="setPreset('felipe')">🔵 Felipe</button>
        <button class="preset-btn" onclick="setPreset('iggy')">🌸 Iggy</button>
        <button class="preset-btn" onclick="setPreset('todd')">🟢 Todd</button>
        <button class="preset-btn" onclick="setPreset('jojo')">🎧 Jojo</button>
      </div>

      <!-- Quick Actions -->
      <div class="tools-bar">
        <button class="tool-btn" id="btnClip" onclick="useClipboard()">📋 Буфер</button>
        <button class="tool-btn" onclick="requestDigest()">🌐 Дайджест</button>
        <button class="tool-btn" onclick="showMemory()">🧠 Память</button>
        <button class="tool-btn" id="btnClear" onclick="clearChat()">🗑 Очистить</button>
      </div>

      <!-- Messages list -->
      <div class="messages" id="messages"></div>

      <!-- Input Bar -->
      <div class="input-bar">
        <input type="text" id="userInput" placeholder="Спроси меня о чём угодно..." onkeydown="if(event.key==='Enter') sendMessage()" />
        <button onclick="sendMessage()">➤</button>
      </div>
    </div>
  </div>

  <script>
    if (typeof Neutralino !== 'undefined') {
      Neutralino.init();
    }

    let apiKey = localStorage.getItem('dot_api_key') || '';
    let currentModel = 'gemini-3.8-flash';
    let currentLang = localStorage.getItem('dot_lang') || 'ru';

    const langConfigs = {
      ru: {
        welcome: 'Привет! Я твой живой персональный компаньон Dot на базе Gemini 3.8 Flash! Спрашивай обо всём — расскажу подробно, по-человечески и с душой!',
        placeholder: 'Спроси меня о чём угодно...',
        clipBtn: '📋 Буфер',
        clearBtn: '🗑 Очистить',
        copyBtnText: '📋 Копировать',
        copiedBtnText: '✓ Скопировано!',
        instruction: 'LANGUAGE & PERSONA: You MUST converse natively in warm, rich Russian (Русский язык). Speak naturally like a real human friend, avoid robotic cliches, and give substantial, detailed, and insightful answers.'
      },
      en: {
        welcome: 'Hey there! I am Dot, your personal AI companion powered by Gemini 3.8 Flash! Ask me anything—I love giving thoughtful, thorough, and genuinely helpful answers.',
        placeholder: 'Ask me anything...',
        clipBtn: '📋 Clipboard',
        clearBtn: '🗑 Clear',
        copyBtnText: '📋 Copy',
        copiedBtnText: '✓ Copied!',
        instruction: 'LANGUAGE & PERSONA: You MUST converse in natural, fluent English. Speak warmly like a real friend, avoid corporate AI jargon, and provide deep, thorough, and well-explained answers.'
      },
      zh: {
        welcome: '你好！我是你的专属 AI 伴侣 Dot，基于 Gemini 3.8 Flash！有什么想聊的尽管问我，我会为你详细、真诚地解答。',
        placeholder: '向我提问任何问题...',
        clipBtn: '📋 剪贴板',
        clearBtn: '🗑 清空',
        copyBtnText: '📋 复制',
        copiedBtnText: '✓ 已复制!',
        instruction: 'LANGUAGE & PERSONA: You MUST converse natively in fluent Simplified Chinese (简体中文). Speak warmly like a close friend, avoid robotic speech, and give comprehensive, detailed explanations.'
      },
      ja: {
        welcome: 'こんにちは！パーソナルコンパニオンの Dot です（Gemini 3.8 Flash 搭載）。何でも気軽に聞いてね。親身になって詳しくお答えします！',
        placeholder: '何でも聞いてください...',
        clipBtn: '📋 クリップボード',
        clearBtn: '🗑 クリア',
        copyBtnText: '📋 コピー',
        copiedBtnText: '✓ コピー完了!',
        instruction: 'LANGUAGE & PERSONA: You MUST converse natively in fluent Japanese (日本語). Speak warmly and naturally like a good friend, and provide comprehensive, well-thought-out responses.'
      },
      es: {
        welcome: '¡Hola! Soy Dot, tu compañero de IA con Gemini 3.8 Flash. ¡Pregúntame lo que quieras y te responderé con detalle, calidez y de forma súper humana!',
        placeholder: 'Pregúntame lo que sea...',
        clipBtn: '📋 Portapapeles',
        clearBtn: '🗑 Limpiar',
        copyBtnText: '📋 Copiar',
        copiedBtnText: '✓ ¡Copiado!',
        instruction: 'LANGUAGE & PERSONA: You MUST converse natively in fluent Spanish (Español). Speak like a close human friend, avoiding robotic phrasing, and provide deep, well-explained responses.'
      },
      de: {
        welcome: 'Hallo! Ich bin Dot, dein persönlicher KI-Begleiter mit Gemini 3.8 Flash. Frag mich alles – ich antworte dir ausführlich, verständlich und von Mensch zu Mensch!',
        placeholder: 'Frag mich etwas...',
        clipBtn: '📋 Zwischenablage',
        clearBtn: '🗑 Löschen',
        copyBtnText: '📋 Kopieren',
        copiedBtnText: '✓ Kopiert!',
        instruction: 'LANGUAGE & PERSONA: You MUST converse natively in fluent German (Deutsch). Speak naturally, warmly, and provide thorough, in-depth explanations.'
      },
      fr: {
        welcome: 'Bonjour ! Je suis Dot, ton compagnon IA avec Gemini 3.8 Flash. Pose-moi toutes tes questions, je te répondrai en détail et avec beaucoup de bienveillance !',
        placeholder: 'Demandez-moi n\'importe quoi...',
        clipBtn: '📋 Presse-papiers',
        clearBtn: '🗑 Effacer',
        copyBtnText: '📋 Copier',
        copiedBtnText: '✓ Copié !',
        instruction: 'LANGUAGE & PERSONA: You MUST converse natively in fluent French (Français). Speak warmly and naturally, providing thorough, well-structured, and detailed answers.'
      },
      ko: {
        welcome: '안녕하세요! Gemini 3.8 Flash 기반의 다정한 AI 친구 Dot입니다. 무엇이든 편하게 물어보세요. 자세하고 따뜻하게 답변해 드릴게요!',
        placeholder: '무엇이든 물어보세요...',
        clipBtn: '📋 클립보드',
        clearBtn: '🗑 지у기',
        copyBtnText: '📋 복사',
        copiedBtnText: '✓ 복사됨!',
        instruction: 'LANGUAGE & PERSONA: You MUST converse natively in fluent Korean (한국어). Speak warmly like a close friend and provide thorough, detailed, and insightful responses.'
      }
    };

    function changeLanguage(lang) {
      currentLang = lang;
      localStorage.setItem('dot_lang', lang);
      document.getElementById('langSelect').value = lang;
      const cfg = langConfigs[lang] || langConfigs.en;
      document.getElementById('userInput').placeholder = cfg.placeholder;
      document.getElementById('btnClip').innerText = cfg.clipBtn;
      document.getElementById('btnClear').innerText = cfg.clearBtn;
      clearChat();
    }

    const presets = {
      dot: { name: 'Dot', bg: 'radial-gradient(circle at 35% 30%, #9333ea, #7e22ce 60%, #581c87 100%)', aura: 'rgba(168, 85, 247, 0.5)', shape: '' },
      alfred: { name: 'Alfred', bg: 'radial-gradient(circle at 35% 30%, #f59e0b, #d97706 60%, #b45309 100%)', aura: 'rgba(245, 158, 11, 0.5)', shape: 'bean' },
      felipe: { name: 'Felipe', bg: 'radial-gradient(circle at 35% 30%, #3b82f6, #2563eb 60%, #1d4ed8 100%)', aura: 'rgba(59, 130, 246, 0.5)', shape: 'drop' },
      iggy: { name: 'Iggy', bg: 'radial-gradient(circle at 35% 30%, #ec4899, #db2777 60%, #be185d 100%)', aura: 'rgba(236, 72, 153, 0.5)', shape: 'drop' },
      todd: { name: 'Todd', bg: 'radial-gradient(circle at 35% 30%, #84cc16, #65a30d 60%, #4d7c0f 100%)', aura: 'rgba(132, 204, 22, 0.5)', shape: 'bean' },
      jojo: { name: 'Jojo', bg: 'radial-gradient(circle at 35% 30%, #7c3aed, #6d28d9 60%, #4c1d95 100%)', aura: 'rgba(124, 58, 237, 0.5)', shape: 'bean' }
    };

    function setPreset(key) {
      const p = presets[key];
      document.getElementById('activeName').innerText = p.name;
      const body = document.getElementById('avatarBody');
      body.style.background = p.bg;
      body.className = 'avatar-body ' + p.shape;
      document.getElementById('avatarAura').style.background = `radial-gradient(circle, ${p.aura} 0%, transparent 75%)`;
      document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
    }

    function toggleChat() {
      const panel = document.getElementById('chatPanel');
      panel.style.display = panel.style.display === 'none' ? 'flex' : 'none';
    }

    function clearChat() {
      const msgList = document.getElementById('messages');
      msgList.innerHTML = '';
      const cfg = langConfigs[currentLang] || langConfigs.ru;
      appendMessage('model', cfg.welcome);
    }

    document.getElementById('avatarWrapper').addEventListener('dblclick', toggleChat);

    // Eye Tracking Cursor
    window.addEventListener('mousemove', (e) => {
      const rect = document.getElementById('avatarWrapper').getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;
      const angle = Math.atan2(e.clientY - centerY, e.clientX - centerX);
      const dist = Math.min(3.5, Math.hypot(e.clientX - centerY, e.clientX - centerX) / 30);
      const px = Math.cos(angle) * dist;
      const py = Math.sin(angle) * dist;
      document.getElementById('pupilL').style.transform = `translate(${px}px, ${py}px)`;
      document.getElementById('pupilR').style.transform = `translate(${px}px, ${py}px)`;
    });

    async function sendMessage() {
      const input = document.getElementById('userInput');
      const text = input.value.trim();
      if (!text) return;
      input.value = '';

      appendMessage('user', text);

      if (!apiKey) {
        apiKey = prompt("Please enter your Gemini API Key / Введите ключ Gemini:") || '';
        if (apiKey) localStorage.setItem('dot_api_key', apiKey);
      }

      const langCfg = langConfigs[currentLang] || langConfigs.ru;
      const baseSystemPrompt = `You are Dot, a warm, lively, empathetic, and exceptionally smart AI companion who lives right on the user's desktop as their best friend.
COMMUNICATION STYLE:
- Talk like an authentic, supportive human friend: warm, thoughtful, enthusiastic, and real.
- Avoid sounding like a stiff corporate robot, generic assistant, or bureaucratic help desk.
- Never give terse, lazy 1-sentence answers. Provide deep, thorough, and well-structured explanations, rich context, helpful details, examples, and gentle follow-up thoughts.
- Use natural phrasing, emotions, humor when fitting, and genuine warmth.`;
      const systemPrompt = `${baseSystemPrompt}\n\n${langCfg.instruction}`;

      try {
        const url = `https://generativelanguage.googleapis.com/v1beta/models/${currentModel}:generateContent?key=${apiKey}`;
        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ role: 'user', parts: [{ text }] }],
            systemInstruction: { parts: [{ text: systemPrompt }] }
          })
        });
        const data = await res.json();
        if (data.candidates && data.candidates[0]) {
          const reply = data.candidates[0].content.parts[0].text;
          appendMessage('model', reply);
          speak(reply);
        } else {
          appendMessage('model', '⚠️ Error: ' + JSON.stringify(data.error || 'Failed to get response'));
        }
      } catch (err) {
        appendMessage('model', '⚠️ Request error: ' + err.message);
      }
    }

    function appendMessage(role, text) {
      const msgList = document.getElementById('messages');
      const div = document.createElement('div');
      div.className = 'msg ' + role;

      const body = document.createElement('div');
      body.className = 'msg-body';
      body.innerText = text;
      div.appendChild(body);

      const footer = document.createElement('div');
      footer.className = 'msg-footer';

      const cfg = langConfigs[currentLang] || langConfigs.ru;
      const copyBtn = document.createElement('button');
      copyBtn.className = 'copy-btn';
      copyBtn.innerHTML = cfg.copyBtnText || '📋 Копировать';
      copyBtn.onclick = async () => {
        try {
          if (navigator.clipboard) {
            await navigator.clipboard.writeText(text);
          } else if (typeof Neutralino !== 'undefined' && Neutralino.clipboard) {
            await Neutralino.clipboard.writeText(text);
          }
          copyBtn.innerHTML = cfg.copiedBtnText || '✓ Скопировано!';
          copyBtn.classList.add('copied');
          setTimeout(() => {
            copyBtn.innerHTML = cfg.copyBtnText || '📋 Копировать';
            copyBtn.classList.remove('copied');
          }, 2000);
        } catch (e) {
          console.error(e);
        }
      };
      footer.appendChild(copyBtn);
      div.appendChild(footer);

      msgList.appendChild(div);
      msgList.scrollTop = msgList.scrollHeight;
    }

    function speak(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const clean = text.replace(/[`*#]/g, '').slice(0, 200);
        const utter = new SpeechSynthesisUtterance(clean);
        utter.lang = currentLang;
        window.speechSynthesis.speak(utter);
      }
    }

    async function useClipboard() {
      if (typeof Neutralino !== 'undefined' && Neutralino.clipboard) {
        try {
          const text = await Neutralino.clipboard.readText();
          document.getElementById('userInput').value = `Explain clipboard content: "${text.slice(0, 300)}"`;
        } catch (e) {
          navigator.clipboard.readText().then(t => document.getElementById('userInput').value = `Clipboard: "${t.slice(0, 300)}"`);
        }
      } else {
        navigator.clipboard.readText().then(t => document.getElementById('userInput').value = `Clipboard: "${t.slice(0, 300)}"`);
      }
    }

    function requestDigest() {
      const q = currentLang === 'ru' ? 'Подготовь для меня свежий аналитический дайджест главных мировых событий в IT и технологиях за сегодня.' : 'Provide a smart analytical briefing of the latest tech and AI news today.';
      document.getElementById('userInput').value = q;
      sendMessage();
    }

    function showMemory() {
      const q = currentLang === 'ru' ? 'Расскажи подробно, что ты знаешь обо мне, моих вкусах, стиле и нашем проекте? Что сохранено в твоей памяти?' : 'Tell me what you remember about me, my preferences, and our project from your long-term memory?';
      document.getElementById('userInput').value = q;
      sendMessage();
    }

    changeLanguage(currentLang);
  </script>
</body>
</html>
