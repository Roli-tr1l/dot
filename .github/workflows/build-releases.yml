name: Build Multi-Platform Releases (Windows, Linux, macOS)

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build-macos-native:
    name: Build Native macOS (DMG)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and Package Dot
        run: |
          chmod +x Scripts/build_app.sh
          bash Scripts/build_app.sh
          mkdir -p /tmp/dmg_staging
          cp -R Dot.app /tmp/dmg_staging/
          ln -s /Applications /tmp/dmg_staging/Applications
          hdiutil create -volname "Dot" -srcfolder /tmp/dmg_staging -ov -format UDZO Dot-macOS.dmg
      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dot-macOS-DMG
          path: Dot-macOS.dmg

  build-cross-platform:
    name: Build Cross-Platform (Windows EXE & Linux AppImage)
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        working-directory: cross-platform
        run: npm install
      - name: Build Windows .exe
        if: runner.os == 'Windows'
        working-directory: cross-platform
        run: npx electron-builder --win
      - name: Build Linux .AppImage
        if: runner.os == 'Linux'
        working-directory: cross-platform
        run: npx electron-builder --linux
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Dot-${{ runner.os }}-Binaries
          path: cross-platform/dist/*
